# Azure Developer CLI project
name: mcp-openapi-creator-kit
metadata:
  template: mcp-openapi-creator-kit@1.0.2
hooks:
  preprovision:
    # Rebuild and validate every active client before preview or provision.
    posix:
      shell: sh
      run: |
        python3 -c "import sys; assert sys.version_info[:2] == (3, 12), 'Python 3.12 is required'"
        python3 tools/build-facade.py
        python3 tools/build-policy-mcp.py --all --allow-incompatible
        python3 tools/build-catalog.py
        python3 tools/validate-deployment-profile.py
        python3 tools/reconcile-all.py --apply-if-env --skip-if-unprovisioned
    windows:
      shell: pwsh
      run: |
        python -c "import sys; assert sys.version_info[:2] == (3, 12), 'Python 3.12 is required'"
        python tools/build-facade.py
        python tools/build-policy-mcp.py --all --allow-incompatible
        python tools/build-catalog.py
        python tools/validate-deployment-profile.py
        python tools/reconcile-all.py --apply-if-env --skip-if-unprovisioned
infra:
  provider: bicep
  path: infra
  module: main
# toolsOnly profiles deploy no additional compute service.
