# Azure Developer CLI project
name: mcp-openapi-creator-kit
metadata:
  template: mcp-openapi-creator-kit@1.0.3
hooks:
  preprovision:
    # Rebuild and validate every active client before preview or provision.
    posix:
      shell: sh
      run: |
        set -eu
        test -x .venv/bin/python || { echo 'Missing .venv: install explicitly with Python >=3.12 before provisioning.' >&2; exit 1; }
        .venv/bin/python tools/preprovision.py
    windows:
      shell: pwsh
      run: |
        if (!(Test-Path .venv\Scripts\python.exe)) { throw 'Missing .venv: install explicitly with Python >=3.12 before provisioning.' }
        & .\.venv\Scripts\python.exe tools\preprovision.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
infra:
  provider: bicep
  path: infra
  module: main
# toolsOnly profiles deploy no additional compute service.
