[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-openapi-creator-kit"
version = "1.1.0"
description = "Read-only MCP companion for the MCP OpenAPI Creator Kit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "MCP OpenAPI Creator Kit contributors" }]
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pip-audit>=2,<3",
  "pytest>=9.0.3,<10",
]

[project.scripts]
mcp-openapi-creator = "mcp_openapi_creator_kit.__main__:main"
mcp-build-catalog = "mcp_openapi_creator_kit.catalog:main"

[project.urls]
Repository = "https://github.com/Iodix7/mcp-openapi-creator-kit"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_openapi_creator_kit = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tools/tests"]
