name: Bug report
description: Report a reproducible problem in the kit
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, subscription keys, Azure identifiers, or customer data.
  - type: input
    id: profile
    attributes:
      label: Gateway profile
      placeholder: native-mcp, policy-mcp-consumption, or rest-consumption
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Azure CLI and azd versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      render: shell
