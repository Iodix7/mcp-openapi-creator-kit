name: Feature request
description: Propose a focused capability or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user outcome is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: dropdown
    id: profile
    attributes:
      label: Affected profile
      options:
        - All profiles
        - native-mcp
        - policy-mcp-consumption
        - rest-consumption
        - Not profile-specific
    validations:
      required: true
